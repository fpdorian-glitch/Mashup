/* MASHUP V3 — cosmos sombre, feuilles holographiques et inspection 3D */
:root{--galaxy-void:#02030a}
.galaxy-surface{background-color:#02030b;background-image:radial-gradient(ellipse at 55% 43%,#39336c4d 0%,#13112b55 21%,transparent 60%),radial-gradient(circle at 24% 76%,#153b8860,transparent 42%),radial-gradient(circle at 79% 20%,#5a296751,transparent 45%),radial-gradient(circle at 50% 50%,#0b1022,#020309 70%);position:relative;isolation:isolate;overflow:hidden}
.galaxy-surface:after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 18% 16%,#eff7ff 0 1px,transparent 2px),radial-gradient(circle at 82% 11%,#f5e6ff 0 1px,transparent 2px),radial-gradient(circle at 74% 79%,#bed9ff 0 1px,transparent 2px),radial-gradient(circle at 31% 87%,#e1bdff 0 1px,transparent 2px),radial-gradient(circle at 8% 53%,#fff 0 .8px,transparent 2px),radial-gradient(circle at 91% 49%,#acbeff 0 .8px,transparent 2px);opacity:.7;z-index:2}
.galaxy-svg{position:relative;z-index:1;width:100%;height:auto;max-height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 7px #756bfa9c) drop-shadow(0 0 12px #307fff82);animation:galaxy-breathe 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes galaxy-breathe{from{filter:drop-shadow(0 0 3px #4b6ff36c) drop-shadow(0 0 9px #9561e561)}to{filter:drop-shadow(0 0 10px #4b6ff3b0) drop-shadow(0 0 17px #bb78fd95)}}
/* La pochette affiche désormais le dos noir aux bras spiralés bleu/violet */
.pack-pouch{height:144px;width:105px;clip-path:polygon(0 3%,100% 3%,100% 97%,0 97%);border:1px solid #9993e29a;background-image:linear-gradient(115deg,#fff4 0%,transparent 22%,#09081922 57%,#fff2 83%,transparent 98%),radial-gradient(ellipse at 60% 35%,#262153 0,#090a1c 57%,#020207 96%);box-shadow:0 12px 30px #0009,0 0 18px #6151ff30;transform:rotate(-7deg);isolation:isolate}
.pack-pouch:before,.pack-pouch:after{z-index:3;height:8px;left:0;background:repeating-linear-gradient(90deg,#a3a2c7 0 3px,#15182c 3px 6px);opacity:.7}
.pack-pouch .galaxy-svg{width:99px;height:111px;transform:scale(1.12)}
.pack-pouch:focus-visible{outline:2px solid #d9c6ff}
.pack:hover .pack-pouch{animation:pack-float 2.4s ease-in-out infinite alternate}
@keyframes pack-float{to{transform:translateY(-5px) rotate(-2deg)}}
.pack-art-gleam{background:radial-gradient(ellipse,#625cfa7a,transparent 68%);opacity:.5;filter:blur(22px)}

.flip-front{border:3px solid #8d87c9;box-shadow:inset 0 0 0 6px #101026,inset 0 0 0 8px #8a86d855;background:#02030a}

/* Légendaires : un éclat métallisé or/blanc. Épiques : holographie irisée multicolore. */
.tcg-card{--shine-x:50%;--shine-y:45%;--foil-angle:125deg;isolation:isolate}
.tcg-card.epic{box-shadow:0 0 0 1px #bba4fb85,0 10px 26px #5f4baf30,inset 0 0 0 1px #ffffff84}
.tcg-card.legendary{box-shadow:0 0 0 1px #fbdc94a1,0 10px 27px #c7a44b44,inset 0 0 0 1px #ffffffb0}
.tcg-card.epic .card-head{background:linear-gradient(115deg,#e0eef3,#e2d4ed 44%,#c3e4e8 81%,#ead7f4)}
.tcg-card.legendary .card-head{background:linear-gradient(120deg,#fff7dc,#edd4a4,#fff1c4,#dbb46c)}
.tcg-card.legendary .card-footer{background:linear-gradient(120deg,#daba6c,#f9eac3,#cbaa68)}
.tcg-card.epic .card-footer{background:linear-gradient(120deg,#aebcd5,#c8e5e6,#d1bded)}

/* V5.5 · Ouverture immersive : une seule pile, carte après carte, aucun ordre de rareté. */
.opening-modal{width:min(100%,925px);background:radial-gradient(ellipse at 50% 0,#272938 0,#171b25 52%,#11151e 100%)}

function normalizePackClient(pack,index=0){
  const base=PACKS[Math.min(index,PACKS.length-1)]||PACKS[0];
  const safe=(v,n)=>String(v??'').trim().slice(0,n);
  const color=(v,f)=>/^#[0-9a-fA-F]{6}$/.test(v||'')?v:f;
  const count=Math.max(1,Math.min(10,Math.round(Number(pack?.count)||base.count||5)));
  const price=Math.max(0,Math.min(1000000,Math.round(Number(pack?.price ?? base.price ?? 0))));
  const min=['common','rare','epic','legendary','mythic'].includes(pack?.min)?pack.min:(base.min||'rare');
  return {
    id:safe(pack?.id||base.id||`pack-${index+1}`,32).toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/--+/g,'-').replace(/^-+|-+$/g,'')||`pack-${index+1}`,
    name:safe(pack?.name||base.name||'Booster',28),
    subtitle:safe(pack?.subtitle||base.subtitle||'',48),
    count,price,free:!!pack?.free,currency:pack?.currency==='dust'?'dust':'coins',min,
    p1:color(pack?.p1,base.p1||'#7f8ca7'),p2:color(pack?.p2,base.p2||'#313a4a'),
    description:safe(pack?.description||base.description||`${count} cartes`,96),
    sign:safe(pack?.sign||base.sign||'✦',4),
    chip:safe(pack?.chip||base.chip||'',24),
    filterMode:['all','universes','cards','series'].includes(pack?.filterMode)?pack.filterMode:'all',
    allowedUniverses:Array.isArray(pack?.allowedUniverses)?pack.allowedUniverses.filter(x=>typeof x==='string').slice(0,50):[],
    allowedCardIds:Array.isArray(pack?.allowedCardIds)?pack.allowedCardIds.filter(x=>typeof x==='string').slice(0,500):[],
    allowedSeries:Array.isArray(pack?.allowedSeries)?[...new Set(pack.allowedSeries.map(Number).filter(n=>Number.isSafeInteger(n)&&n>0&&n<=999))].slice(0,30):[]
  };
}
function syncClientPacks(list){
  const next=(Array.isArray(list)&&list.length?list:PACKS).map((p,i)=>normalizePackClient(p,i));
  PACKS.splice(0,PACKS.length,...next);
}

function statValue(card, key){
  // Les cartes créées en V1 (ATQ / DÉF / AURA) restent compatibles.
  const val = key==='power' ? (card.power ?? card.atk) : card[key];
  const fallback = key==='size' ? 50 : key==='intelligence' ? 50 : 60;
  return Math.max(0, Math.min(100, Math.round(Number.isFinite(Number(val)) && val!==undefined && val!==null && val!=='' ? Number(val) : fallback)));
}
function normalizeCard(card){
  return {...card, power:statValue(card,'power'),size:statValue(card,'size'),def:statValue(card,'def'),aura:statValue(card,'aura'),intelligence:statValue(card,'intelligence')};
}
function loadSave(){
  try {
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved && typeof saved==='object'){
      return {...clone(DEFAULT_SAVE),...saved,
        owned:{...DEFAULT_SAVE.owned,...(saved.owned||{})},
        artwork:saved.artwork||{},custom:Array.isArray(saved.custom)?saved.custom.map(normalizeCard):[],
        deck:Array.isArray(saved.deck)?saved.deck:clone(DEFAULT_SAVE.deck),
        favorites:Array.isArray(saved.favorites)?saved.favorites:[]};

}

function cardMarkup(card,options={}){

function weightedCard(minRarity){
  let range=allCards();
  if(minRarity){const threshold=RARITIES[minRarity].sort;range=range.filter(c=>RARITIES[c.rarity]?.sort>=threshold);}
  if(!range.length)range=allCards();
  const weights=range.map(c=>RARITIES[c.rarity]?.odds??50);const total=weights.reduce((a,b)=>a+b,0);let x=Math.random()*total;
  for(let i=0;i<range.length;i++){x-=weights[i];if(x<=0)return range[i];}return range[range.length-1];
}

function revealNextCard(){
  if(packFlipBusy||packRevealed.size>=packResults.length)return;
  const i=packRevealed.size;
  const button=document.querySelector('.opening-top-card');

      if(!button.isConnected){packFlipBusy=false;return;}
      packCardFaceUp=true;packFlipBusy=false;button.disabled=false;setOpeningTheme(specialRevealType(packResults[i]));
      button.setAttribute('aria-label',`Mettre de côté ${packResults[i].name} et voir la carte suivante`);

function inspectSpring(frameTime){
  inspectionFrame = 0;
  if(!inspection)return;
  const s=inspection;
  const delta=s.lastFrame?Math.min((frameTime-s.lastFrame)/1000,.042):1/60;
  s.lastFrame=frameTime;
  const k=170, damping=18; // ressort + frottement : écart, vitesse, amortissement
  for(const axis of ['rx','ry']){
    const speed='v'+axis, target='t'+axis;
    s[speed]+=(k*(s[target]-s[axis])-damping*s[speed])*delta;
    s[axis]+=s[speed]*delta;
  }
  updateInspection();
  const moving=Math.abs(s.rx-s.trx)+Math.abs(s.ry-s.try)+Math.abs(s.vrx)+Math.abs(s.vry)>0.06;
  if(s.dragging||moving){inspectionFrame=requestAnimationFrame(inspectSpring);}
  else{s.rx=s.ry=s.vrx=s.vry=0;updateInspection();}
}
function startInspectionMotion(){if(!inspectionFrame){if(inspection)inspection.lastFrame=0;inspectionFrame=requestAnimationFrame(inspectSpring);}}
function stopInspectionMotion(){if(inspectionFrame)cancelAnimationFrame(inspectionFrame);inspectionFrame=0;}
function showMagnifiedCard(id){
  const c=getCard(id);if(!c||c.hidden||(onlineUser?.role!=='admin'&&!state.owned?.[id]))return;
  stopInspectionMotion();
  inspection={id,rx:0,ry:0,trx:0,try:0,vrx:0,vry:0,dragging:false,pointerId:null,x:0,y:0,startX:0,startY:0,lastFrame:0};
  document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop inspect-backdrop" role="dialog" aria-modal="true" aria-label="Carte grand format ${esc(c.name)}">

      <div class="inspect-header-actions"><button class="btn btn-sm btn-quiet" data-action="back-to-detail" data-id="${esc(id)}">← Fiche</button><button class="icon-button" data-action="close-modal" aria-label="Fermer">×</button></div></div>

      <div class="inspect-instructions"><span><kbd>Clic droit</kbd> + déplacement : résistance et reflets ; relâche pour revenir à plat</span><span>Sur mobile : glisse ton doigt · Retour automatique avec inertie</span></div>

    </div></div>`;

function updateInspection(){
  if(!inspection)return;
  const el=document.querySelector('.inspect-tilter');if(!el)return;
  el.style.setProperty('--rx',`${inspection.rx}deg`);
  el.style.setProperty('--ry',`${inspection.ry}deg`);
  el.classList.toggle('dragging',inspection.dragging);
  const card=el.querySelector('.tcg-card');
  if(card){
    const lightX=Math.max(0,Math.min(100,50+Math.sin(inspection.ry*Math.PI/180)*43));
    const lightY=Math.max(0,Math.min(100,45-Math.sin(inspection.rx*Math.PI/180)*50));
    card.style.setProperty('--shine-x',`${lightX}%`);
    card.style.setProperty('--shine-y',`${lightY}%`);
    card.style.setProperty('--foil-angle',`${125+inspection.ry*.6}deg`);
  }
}
function inspectPointerDown(e){
  if(!inspection)return;
  const surface=e.target.closest('.inspect-tilter');if(!surface)return;
  if(e.pointerType==='mouse'&&e.button!==2)return;
  if(e.pointerType!=='mouse'&&e.button!==0)return;
  e.preventDefault();
  inspection.dragging=true;inspection.pointerId=e.pointerId;
  inspection.x=e.clientX;inspection.y=e.clientY;
  inspection.startX=inspection.ry;inspection.startY=inspection.rx;
  surface.setPointerCapture(e.pointerId);
  startInspectionMotion();
}
function inspectPointerMove(e){
  if(!inspection||!inspection.dragging||e.pointerId!==inspection.pointerId)return;
  // Effet « élastique » : plus la souris s'éloigne, plus la carte résiste.
  const resistant=(v,max)=>Math.sign(v)*max*(1-Math.exp(-Math.abs(v)/max));
  inspection.try=resistant(inspection.startX+(e.clientX-inspection.x)*.65,63);
  inspection.trx=resistant(inspection.startY-(e.clientY-inspection.y)*.39,34);
  startInspectionMotion();
}
function inspectPointerUp(e){
  if(!inspection||!inspection.dragging||inspection.pointerId!==e.pointerId)return;
  inspection.dragging=false;inspection.pointerId=null;
  inspection.trx=0;inspection.try=0;
  startInspectionMotion();
}
function inspectReset(){
  if(!inspection)return;
  inspection.dragging=false;inspection.pointerId=null;
  inspection.trx=0;inspection.try=0;
  startInspectionMotion();
}

function shuffled(items){
  const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;
}
function chooseOpponents(streak,count){
  const list=allCards().map(c=>({card:c, strength:STAT_FIELDS.reduce((sum,f)=>sum+statValue(c,f.key),0)/STAT_FIELDS.length}));
  // Force de l'équipe adverse croissante selon la série, sans cartes inventées.
  list.sort((a,b)=>a.strength-b.strength);
  const target=Math.min(0.9,0.15+streak*.082);
  const available=[...list],picked=[];
  while(available.length&&picked.length<count){
    const aim=target*(available.length-1);
    const spread=Math.max(.4,2.5-streak*.18);
    const index=Math.max(0,Math.min(available.length-1,Math.round(aim+(Math.random()-.5)*spread*2)));
    picked.push(available.splice(index,1)[0].card);
  }
  while(picked.length<count&&list.length)picked.push(list[picked.length%list.length].card);
  return picked;
}

function pickAIStat(){
  const ec=getCard(battle.enemy[battle.round]);
  const chance=arenaDifficulty(battle.startingStreak).select;
  const ranked=[...STAT_FIELDS].sort((a,b)=>battle.direction==='higher'?statValue(ec,b.key)-statValue(ec,a.key):statValue(ec,a.key)-statValue(ec,b.key));
  // L'IA se base uniquement sur sa propre carte : elle n'a pas accès à la valeur cachée du joueur.
  if(Math.random()<chance)return ranked[0].key;
  return ranked[Math.floor(Math.random()*ranked.length)].key;
}

async function challengeStat(key,fromAI=false){
  if(!battle||battle.finished||battle.stage!=='choose'||isAITurn()!==fromAI)return;
  try{const r=await api('/api/battles/choose',{stat:key});battle=r.battle;state=r.state;updateBalances();if(battle?.finished)toast('Combat terminé : +'+Number(battle.reward?.coins||0)+' crédits crédités !');renderCombat();}catch(e){toast(e.message,true);}return;

  if(!battle||battle.finished||battle.stage!=='choose'||!STAT_FIELDS.some(f=>f.key===key)||isAITurn()!==fromAI)return;
  const pc=getCard(battle.player[battle.round]),ec=getCard(battle.enemy[battle.round])||battle.revealedCard;
  if(!pc||!ec)return;
  const pValue=statValue(pc,key),eValue=statValue(ec,key);
  const margin=battle.direction==='higher'?pValue-eValue:eValue-pValue;
  const winner=margin>0?'player':margin<0?'enemy':'tie';
  if(winner==='player')battle.playerScore++;else if(winner==='enemy')battle.enemyScore++;else battle.ties++;
  battle.margin+=margin;
  battle.last={key,pValue,eValue,winner,margin};
  battle.history.push({name:pc.name,key:STAT_FIELDS.find(f=>f.key===key).label,pValue,eValue,winner,margin,actor:fromAI?'ai':'player'});
  battle.stage='reveal';
  if(battle.round===3){
    battle.finished=true;
    battle.result=battle.playerScore>battle.enemyScore?'win':battle.playerScore<battle.enemyScore?'loss':battle.margin>0?'win':battle.margin<0?'loss':'draw';
    const oldStreak=Math.max(0,Number(state.streak)||0);
    if(battle.result==='win'){
      battle.reward=nextWinReward(oldStreak);
      state.coins+=battle.reward.coins;state.dust+=battle.reward.dust;state.wins++;
      state.streak=oldStreak+1;state.bestStreak=Math.max(Number(state.bestStreak)||0,state.streak);
    }else if(battle.result==='draw'){
      battle.reward={coins:40,dust:0};state.coins+=40;state.draws=(Number(state.draws)||0)+1;
    }else{
      battle.reward={coins:20,dust:0};state.coins+=20;state.streak=0;state.losses=(Number(state.losses)||0)+1;
    }
    save();
  }
  updateBalances();
  renderCombat();
}

async function openImageCropper(file,cardId=null){
  if(!onlineUser||onlineUser.role!=='admin')return;
  if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Choisis une image JPG, PNG ou WebP.');
  if(file.size>15*1024*1024)throw new Error('Image trop volumineuse (15 Mo maximum).');
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Image impossible à ouvrir.'));img.src=url;});
    const canvas=document.createElement('canvas');canvas.width=900;canvas.height=750;
    cropEditor={img,canvas,zoom:1,offsetX:0,offsetY:0,cardId,previous:document.getElementById('modal-root').innerHTML,url};
    const root=document.getElementById('modal-root');
    root.innerHTML=`<div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Recadrage de l’image"><div class="modal-box crop-window"><div class="modal-head"><div><div class="eyebrow">ATELIER · CADRAGE</div><h2>Recadrer l’illustration</h2><p class="small-note">Glisse l’image pour la déplacer, ajuste le zoom, puis valide. Seul le cadrage enregistré sera publié.</p></div><button class="icon-button" aria-label="Annuler" data-action="close-modal">×</button></div><div class="crop-stage" id="crop-stage"></div><div class="crop-controls"><label>Zoom <input id="crop-zoom" type="range" min="1" max="3.5" step="0.025" value="1"></label></div><div class="detail-actions"><button class="btn btn-sm" data-action="crop-reset">Centrer</button><button class="btn btn-primary" data-action="crop-confirm">Valider le cadrage ↗</button></div></div></div>`;
    root.querySelector('#crop-stage').appendChild(canvas);
    const stage=root.querySelector('#crop-stage');let start=null;
    stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY,left:cropEditor.offsetX,top:cropEditor.offsetY};stage.classList.add('dragging');});
    stage.addEventListener('pointermove',e=>{if(!start||!cropEditor)return;const factor=canvas.width/stage.getBoundingClientRect().width;cropEditor.offsetX=start.left+(e.clientX-start.x)*factor;cropEditor.offsetY=start.top+(e.clientY-start.y)*factor;drawImageCrop();});
    const end=()=>{start=null;stage.classList.remove('dragging');};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
    drawImageCrop();
  }catch(e){URL.revokeObjectURL(url);cropEditor=null;throw e;}
}
function drawImageCrop(){
  if(!cropEditor)return;
  const {img,canvas,zoom}=cropEditor,ctx=canvas.getContext('2d');
  const base=Math.max(canvas.width/img.width,canvas.height/img.height),scale=base*zoom;
  const w=img.width*scale,h=img.height*scale;
  const limX=(w-canvas.width)/2,limY=(h-canvas.height)/2;
  cropEditor.offsetX=Math.max(-limX,Math.min(limX,cropEditor.offsetX));
  cropEditor.offsetY=Math.max(-limY,Math.min(limY,cropEditor.offsetY));
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,(canvas.width-w)/2+cropEditor.offsetX,(canvas.height-h)/2+cropEditor.offsetY,w,h);
}
function resetImageCrop(){if(!cropEditor)return;cropEditor.zoom=1;cropEditor.offsetX=0;cropEditor.offsetY=0;const slider=document.getElementById('crop-zoom');if(slider)slider.value=1;drawImageCrop();}

async function compressImage(file){
  if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Utilise une image PNG, JPG ou WebP.');
  if(file.size>15*1024*1024)throw new Error('Image trop volumineuse (15 Mo maximum).');
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);const scale=Math.min(1,700/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');if(!ctx)return reject(new Error('Impossible de traiter cette image.'));ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.73));};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Cette image ne peut pas être lue.'));};img.src=url;
  });
}

async function importSave(file){
 if(onlineUser?.role!=='admin')return;
 try{const raw=JSON.parse(await file.text());if(!confirm('Importer cette ancienne collection dans ton compte admin et publier ses cartes personnalisées ?'))return;const r=await api('/api/admin/import',{save:raw});BASE_CARDS=r.cards;state=r.state;state.custom=[];render();toast('Collection V4 importée sur ton compte !');}catch(e){toast(e.message||'Sauvegarde invalide.',true);}return;
  if(!file)return;
  if(file.size>12*1024*1024){toast('Sauvegarde trop volumineuse.',true);return;}
  try{
    const data=JSON.parse(await file.text());
    if(!data||typeof data!=='object'||!data.owned||!Array.isArray(data.custom)||!Array.isArray(data.deck))throw new Error('Structure incorrecte');
    if(!confirm('Cette importation remplacera ta progression actuelle. Continuer ?'))return;
    const validCard=c=>c&&typeof c.id==='string'&&/^user-[\w-]{1,60}$/.test(c.id)&&typeof c.name==='string'&&RARITIES[c.rarity];
    state={...clone(DEFAULT_SAVE),...data,custom:data.custom.filter(validCard).slice(0,120).map(normalizeCard),artwork:data.artwork&&typeof data.artwork==='object'?data.artwork:{},owned:data.owned,deck:data.deck.filter(id=>typeof id==='string').slice(0,3),favorites:Array.isArray(data.favorites)?data.favorites:[]};
    state.coins=Math.max(0,Math.min(1000000,Number(state.coins)||0));state.dust=Math.max(0,Math.min(1000000,Number(state.dust)||0));state.streak=Math.max(0,Math.min(100000,Math.floor(Number(state.streak)||0)));state.bestStreak=Math.max(state.streak,Math.min(100000,Math.floor(Number(state.bestStreak)||0)));
    save();toast('Sauvegarde importée !');render();
  }catch(e){toast('Fichier de sauvegarde invalide.',true);}
}

    <div class="booster-contents"><label>Mode de sélection<select data-pack-field="filterMode" data-pack-index="${i}" data-content-mode="${i}"><option value="all" ${mode==='all'?'selected':''}>Tout le catalogue</option><option value="universes" ${mode==='universes'?'selected':''}>Un ou plusieurs univers</option><option value="series" ${mode==='series'?'selected':''}>Une ou plusieurs séries complètes</option><option value="cards" ${mode==='cards'?'selected':''}>Choix précis des cartes</option></select></label>
    <div class="content-mode-panel" data-content-panel="${i}-series" ${mode==='series'?'':'hidden'}><p class="rate-help">Les cartes de toutes les séries cochées sont automatiquement incluses, y compris celles que tu ajouteras plus tard. Une série vide ne peut pas encore alimenter un booster.</p><div class="content-picker-list">${series.map(s=>`<label><input type="checkbox" data-allow-series="${i}" value="${s.number}" ${(p.allowedSeries||[]).includes(s.number)?'checked':''}><span>S${String(s.number).padStart(2,'0')} · ${esc(s.name)} <small>(${BASE_CARDS.filter(c=>!c.hidden&&(Number(c.editionSeries)||1)===s.number).length} cartes)</small></span></label>`).join('')}</div></div>
    <div class="content-mode-panel" data-content-panel="${i}-universes" ${mode==='universes'?'':'hidden'}><p class="rate-help">Coche les univers que ce booster pourra contenir.</p><div class="content-picker-list">${families.map(f=>`<label><input type="checkbox" data-allow-universe="${i}" value="${esc(f)}" ${p.allowedUniverses?.includes(f)?'checked':''}><span>${esc(f)}</span></label>`).join('')}</div></div>
    <div class="content-mode-panel" data-content-panel="${i}-cards" ${mode==='cards'?'':'hidden'}><p class="rate-help">Sélectionne chaque carte autorisée, même si elle appartient à un univers différent.</p><input type="search" data-content-search="${i}" placeholder="Rechercher une carte ou un univers…"><div class="content-picker-controls"><button class="btn btn-sm" data-action="select-pack-cards" data-pack-index="${i}">Tout sélectionner</button><button class="btn btn-sm" data-action="clear-pack-cards" data-pack-index="${i}">Tout retirer</button></div><div class="content-picker-list" data-content-card-list="${i}">${BASE_CARDS.filter(c=>!c.hidden).map(c=>`<label data-card-search="${esc((c.name+' '+c.family).toLowerCase())}"><input type="checkbox" data-allow-card="${i}" value="${esc(c.id)}" ${p.allowedCardIds?.includes(c.id)?'checked':''}><span>${esc(c.name)} <small>· ${esc(c.family)}</small></span></label>`).join('')}</div></div>
    </div></details>`;
}
// La virgule française et le point sont acceptés, avec jusqu'à 3 décimales.
const BOOSTER_RATE_SCALE=1000;
function parseBoosterRate(value){
  const raw=String(value??'').trim().replace(',', '.');
  if(!/^(?:\d{1,3})(?:\.\d{1,3})?$/.test(raw))return NaN;
  const n=Number(raw),units=Math.round(n*BOOSTER_RATE_SCALE);
  return n>=0&&n<=100&&Math.abs(units-n*BOOSTER_RATE_SCALE)<1e-7?units/BOOSTER_RATE_SCALE:NaN;
}
function boosterRateText(value){return Number(value||0).toLocaleString('fr-FR',{maximumFractionDigits:3});}
function renderPackRateEditor(){
  if(onlineUser?.role!=='admin')return;
  const root=document.getElementById('admin-rate-editor');if(!root)return;
  root.innerHTML=`<div class="booster-manager">${PACKS.map((p,i)=>{
    const rates=packRates[p.id]||PACK_RATE_DEFAULTS[p.id]||{common:45,rare:28,epic:18,legendary:8,mythic:1,ultra:0};
    const totalUnits=Object.values(rates).reduce((n,v)=>n+Math.round(Number(v||0)*BOOSTER_RATE_SCALE),0);
    const total=totalUnits/BOOSTER_RATE_SCALE;
    return `<article class="booster-line" data-pack-box="${esc(p.id)}">
      <div class="booster-line-header"><div class="booster-line-preview" style="--p1:${p.p1};--p2:${p.p2}">${GALAXY_MARK}</div>
        <div class="booster-line-title"><strong>${esc(p.name)}</strong><small>${p.count} carte${p.count>1?'s':''} · ${p.price} ${p.currency==='dust'?'éclats':'crédits'} · ${esc(p.chip||'Booster')}</small></div>
        <div class="booster-line-ctas"><button class="btn btn-sm" data-action="toggle-booster-editor" data-pack-index="${i}" aria-expanded="false">✎ Modifier</button><button class="btn btn-sm btn-danger" data-action="remove-pack-row" data-pack-index="${i}" ${PACKS.length<=1?'disabled':''} aria-label="Supprimer ${esc(p.name)}">×</button></div>
      </div>
      <div class="booster-fold" data-pack-fold="${i}" hidden>
        <div class="booster-basics">
          <label>Nom<input data-pack-field="name" data-pack-index="${i}" value="${esc(p.name)}" maxlength="28"></label>
          <label>Prix (monnaie choisie)<input type="number" min="0" max="1000000" step="1" data-pack-field="price" data-pack-index="${i}" value="${Number(p.price)||0}"></label>
          <label>Monnaie<select data-pack-field="currency" data-pack-index="${i}"><option value="coins" ${p.currency!=='dust'?'selected':''}>◉ Crédits</option><option value="dust" ${p.currency==='dust'?'selected':''}>✧ Éclats</option></select></label>
          <label>Cartes par booster<input type="number" min="1" max="10" step="1" data-pack-field="count" data-pack-index="${i}" value="${Number(p.count)||5}"></label>
          <label>Garantie minimale<select data-pack-field="min" data-pack-index="${i}">${['common','rare','epic','legendary','mythic'].map(k=>`<option value="${k}" ${p.min===k?'selected':''}>${rarityName(k)}</option>`).join('')}</select></label>
        </div>
        <details><summary>🎨 Apparence et informations complémentaires</summary><div class="booster-options">
          <label>Couleur dominante<input type="color" data-pack-field="p1" data-pack-index="${i}" value="${esc(p.p1)}"></label>
          <label>Couleur secondaire<input type="color" data-pack-field="p2" data-pack-index="${i}" value="${esc(p.p2)}"></label>
          <label>Badge<input data-pack-field="chip" data-pack-index="${i}" value="${esc(p.chip||'')}" maxlength="24"></label>
          <label>Sous-titre<input data-pack-field="subtitle" data-pack-index="${i}" value="${esc(p.subtitle||'')}" maxlength="48"></label>
          <label>Description<input data-pack-field="description" data-pack-index="${i}" value="${esc(p.description||'')}" maxlength="96"></label>
          <label>Symbole<input data-pack-field="sign" data-pack-index="${i}" value="${esc(p.sign||'✦')}" maxlength="4"></label>
          <label>Premier booster offert<select data-pack-field="free" data-pack-index="${i}"><option value="false" ${!p.free?'selected':''}>Non</option><option value="true" ${p.free?'selected':''}>Oui</option></select></label>
          <label>Identifiant interne<input data-pack-field="id" data-pack-index="${i}" value="${esc(p.id)}" maxlength="32" pattern="[a-z0-9-]{2,32}" title="Lettres minuscules, chiffres, tirets uniquement"></label>
        </div><p class="rate-help" style="margin:0 13px 12px">La couleur s'applique à la pochette autour de la spirale; le panneau derrière reste noir. Évite de changer l'identifiant d'un booster déjà utilisé.</p></details>
        <details><summary>🎲 Probabilités de tirage — <span class="rate-total ${totalUnits!==100000?'rate-invalid':''}" data-rate-total="${esc(p.id)}">${boosterRateText(total)} %</span></summary><div class="booster-rates"><div class="booster-rate-grid">${Object.entries(RARITIES).map(([key,rarity])=>`<label><span>${rarity.label}</span><div><input type="text" inputmode="decimal" maxlength="7" data-pack-rate="${esc(p.id)}" data-rarity="${key}" value="${boosterRateText(rates[key]||0)}" aria-label="${rarity.label} ${esc(p.name)}"><small>%</small></div></label>`).join('')}</div><p class="rate-help">La somme doit être 100 %. Taux au millième autorisés : 0,001 % = 1 chance sur 100 000. Virgule ou point accepté. Une rareté encore absente du catalogue est redistribuée parmi les autres. La garantie s'applique seulement si cette rareté existe. Les éditions Full Art et Gold ont un poids plus faible à rareté égale.</p></div></details>
        ${boosterContentEditor(p,i)}
      </div>
    </article>`;
  }).join('')}</div>`;
}
function toggleBoosterEditor(index){
  const fold=document.querySelector(`[data-pack-fold="${Number(index)}"]`);if(!fold)return;
  const opening=fold.hidden;
  document.querySelectorAll('[data-pack-fold]').forEach(el=>el.hidden=true);
  document.querySelectorAll('[data-pack-box]').forEach(el=>el.classList.remove('open'));
  document.querySelectorAll('[data-action="toggle-booster-editor"]').forEach(el=>el.setAttribute('aria-expanded','false'));
  if(opening){fold.hidden=false;fold.closest('.booster-line').classList.add('open');document.querySelector(`[data-action="toggle-booster-editor"][data-pack-index="${Number(index)}"]`)?.setAttribute('aria-expanded','true');}
}
function updateRateTotal(packId){
  const inputs=[...document.querySelectorAll(`[data-pack-rate="${packId}"]`)];
  const amounts=inputs.map(x=>parseBoosterRate(x.value));
  const valid=amounts.every(Number.isFinite);
  const sumUnits=valid?amounts.reduce((n,x)=>n+Math.round(x*BOOSTER_RATE_SCALE),0):0;
  const el=document.querySelector(`[data-rate-total="${packId}"]`);
  if(el){el.textContent=valid?boosterRateText(sumUnits/BOOSTER_RATE_SCALE)+' %':'Taux invalide';el.classList.toggle('rate-invalid',!valid||sumUnits!==100000);}
}
function captureBoosterDraft(){
  for(let i=0;i<PACKS.length;i++){
    const read=field=>document.querySelector(`[data-pack-field="${field}"][data-pack-index="${i}"]`);
    if(!read('id'))continue;
    const p=PACKS[i];
    // Preserve edits before adding/removing another booster. Validation stays in saveBoosterConfig.
    for(const key of ['id','name','subtitle','chip','description','sign','p1','p2','min'])p[key]=read(key)?.value??p[key];
    p.price=Number(read('price')?.value??p.price);p.count=Number(read('count')?.value??p.count);
    p.free=read('free')?.value==='true';
    p.currency=read('currency')?.value==='dust'?'dust':'coins';
    p.filterMode=read('filterMode')?.value||'all';
    p.allowedUniverses=[...document.querySelectorAll(`[data-allow-universe="${i}"]:checked`)].map(x=>x.value);
    p.allowedCardIds=[...document.querySelectorAll(`[data-allow-card="${i}"]:checked`)].map(x=>x.value);
    p.allowedSeries=[...document.querySelectorAll(`[data-allow-series="${i}"]:checked`)].map(x=>Number(x.value));
    const oldRates=packRates[p._savedId||p.id]||packRates[p.id]||{common:45,rare:28,epic:18,legendary:8,mythic:1,ultra:0};
    const originalId=document.querySelector(`[data-pack-box]`) && document.querySelectorAll('[data-pack-box]')[i]?.dataset.packBox;
    const rateId=originalId||p.id;
    const next={};
    for(const k of Object.keys(RARITIES)){
      const input=document.querySelector(`[data-pack-rate="${rateId}"][data-rarity="${k}"]`);
      next[k]=input?parseBoosterRate(input.value):oldRates[k]||0;
    }
    packRates[p.id]=next;
  }
}
function addPackRow(){
  if(PACKS.length>=20)return toast('Maximum 20 boosters.',true);
  captureBoosterDraft();
  let newId;do{newId=`pack-${Math.random().toString(36).slice(2,8)}`;}while(PACKS.some(x=>x.id===newId));
  const fresh={id:newId,name:'Nouveau booster',subtitle:'Édition personnalisée',count:5,price:350,free:false,min:'rare',p1:'#9071e8',p2:'#382473',description:'5 cartes · nouveau booster',sign:'✦',chip:'NOUVEAU'};
  PACKS.push(fresh);packRates[newId]={common:45,rare:28,epic:18,legendary:8,mythic:1,ultra:0};
  renderPackRateEditor();toggleBoosterEditor(PACKS.length-1);
}
function removePackRow(index){
  index=Number(index);if(!Number.isInteger(index)||index<0||index>=PACKS.length)return;
  if(PACKS.length<=1)return toast('Il faut conserver au moins un booster.',true);
  if(!confirm(`Retirer le booster « ${PACKS[index].name} » de la boutique ? Les cartes des joueurs seront conservées.`))return;
  captureBoosterDraft();PACKS.splice(index,1);renderPackRateEditor();
}
async function saveBoosterConfig(){
  if(onlineUser?.role!=='admin')return;
  const packs=[],rates={},ids=new Set();let freeCount=0;
  for(let i=0;i<PACKS.length;i++){
    const read=field=>document.querySelector(`[data-pack-field="${field}"][data-pack-index="${i}"]`);
    const raw={id:read('id')?.value,name:read('name')?.value,subtitle:read('subtitle')?.value,chip:read('chip')?.value,description:read('description')?.value,sign:read('sign')?.value,
      price:Number(read('price')?.value),currency:read('currency')?.value||'coins',count:Number(read('count')?.value),min:read('min')?.value,p1:read('p1')?.value,p2:read('p2')?.value,free:read('free')?.value==='true',
      filterMode:read('filterMode')?.value||'all',
      allowedUniverses:[...document.querySelectorAll(`[data-allow-universe="${i}"]:checked`)].map(x=>x.value),
      allowedCardIds:[...document.querySelectorAll(`[data-allow-card="${i}"]:checked`)].map(x=>x.value),
      allowedSeries:[...document.querySelectorAll(`[data-allow-series="${i}"]:checked`)].map(x=>Number(x.value))};
    if(!/^[a-z0-9-]{2,32}$/.test(raw.id||'')){toast('Identifiant : 2 à 32 lettres minuscules, chiffres ou tirets.',true);return;}
    if(!raw.name?.trim()||raw.name.trim().length<2){toast('Chaque booster doit avoir un nom.',true);return;}
    if(!Number.isInteger(raw.price)||raw.price<0||raw.price>1000000||!Number.isInteger(raw.count)||raw.count<1||raw.count>10){toast('Prix : 0 à 1 000 000. Cartes : 1 à 10.',true);return;}
    if(ids.has(raw.id)){toast('Chaque booster doit avoir un identifiant unique.',true);return;}ids.add(raw.id);
    if(raw.free)freeCount++;
    const p=normalizePackClient(raw,i);packs.push(p);
    const originalId=PACKS[i].id;
    rates[p.id]={};let totalUnits=0;
    for(const key of Object.keys(RARITIES)){
      const input=document.querySelector(`[data-pack-rate="${originalId}"][data-rarity="${key}"]`);
      const n=parseBoosterRate(input?.value);
      if(!input||!Number.isFinite(n)){toast('Pourcentages : 0 à 100, avec 3 décimales maximum (exemple : 0,001).',true);return;}
      rates[p.id][key]=n;totalUnits+=Math.round(n*BOOSTER_RATE_SCALE);
    }
    if(totalUnits!==100000){toast(`Le booster « ${p.name} » totalise ${boosterRateText(totalUnits/BOOSTER_RATE_SCALE)} % au lieu de 100 %.`,true);return;}
  }
  if(freeCount>1){toast('Un seul booster peut être offert une fois par joueur.',true);return;}
  try{
    const response=await api('/api/admin/packs',{packs,packRates:rates});
    syncClientPacks(response.packs);packRates=response.packRates;
    toast('Boosters enregistrés et visibles par tous les joueurs.');renderPackRateEditor();
  }catch(e){toast(e.message,true);}
}
async function simulateBoosterAdmin(){
 if(onlineUser?.role!=='admin')return;
 const root=document.getElementById('booster-sim-result');if(!root)return;
 const id=document.getElementById('simulate-pack-id')?.value;
 const openings=Number(document.getElementById('simulate-count')?.value);
 root.textContent='Simulation en cours…';
 try{const data=await api('/api/admin/packs/simulate',{id,openings});
  const line=([key,count])=>{const share=(100*count/Math.max(1,data.draws)).toFixed(1);const config=data.configuredRates[key];return `<div class="sim-result-row"><span>${esc(rarityName(key))}</span><div class="sim-bar"><i style="width:${share}%"></i></div><strong>${share} %</strong></div>`;};
  root.innerHTML=`<div class="booster-simulator-output"><strong>${data.openings.toLocaleString('fr-FR')} boosters · ${data.draws.toLocaleString('fr-FR')} cartes simulées</strong><p class="small-note">${data.possibleCards} cartes éligibles · coût fictif : ${data.totalCost.toLocaleString('fr-FR')} ${data.currency==='dust'?'éclats':'crédits'}</p><h4>Raretés tirées</h4>${Object.entries(data.rarities).map(line).join('')}<p class="small-note">Les taux affichés sont observés : ils incluent la garantie du booster et la redistribution des raretés absentes.</p><h4>Finitions</h4><p class="small-note">${Object.entries(data.variants).map(([k,v])=>`${k==='secret'?'Secrète':k==='full_art'?'Full Art':k==='gold'?'Gold':'Standard'} : ${v}`).join(' · ')}</p><h4>Cartes les plus tirées</h4><p class="small-note">${data.topCards.map(x=>`${esc(x.name)} (${x.draws})`).join(' · ')||'Aucune'}</p></div>`;
 }catch(e){root.textContent=e.message;toast(e.message,true);}
}
function renderAdminCards(filter=''){
  if(onlineUser?.role!=='admin')return;
  const node=document.getElementById('admin-card-list');if(!node)return;
  const q=String(filter).trim().toLocaleLowerCase('fr-FR');
  const cards=BASE_CARDS.filter(c=>(c.name+' '+c.family+' '+c.id).toLocaleLowerCase('fr-FR').includes(q));
  node.innerHTML=cards.length?cards.slice(0,150).map(c=>`<div class="admin-card-row"><div><strong>${esc(c.name)}</strong><small>${esc(c.family)} · ${esc(cardRarityLabel(c))}</small></div><button class="btn btn-sm" data-action="edit-card" data-id="${esc(c.id)}">✎ Modifier</button></div>`).join(''):'<p class="panel-p">Aucune carte trouvée.</p>';
  if(cards.length>150)node.insertAdjacentHTML('beforeend',`<p class="small-note">150 cartes affichées sur ${cards.length}. Affine la recherche.</p>`);
}
async function adjustPlayerCredits(id,sign){
  if(onlineUser?.role!=='admin')return;
  const input=[...document.querySelectorAll('[data-credit-input]')].find(el=>el.dataset.creditInput===id);
  if(!input)return;
  const quantity=Number(input.value);
  if(!Number.isSafeInteger(quantity)||quantity<=0||quantity>1000000){toast('Entre un nombre entier de 1 à 1 000 000.',true);return;}
  const amount=sign*quantity;
  if(!confirm(`${amount>0?'Ajouter':'Retirer'} ${quantity.toLocaleString('fr-FR')} crédits ${amount>0?'au':'du'} compte joueur ?`))return;
  try{
    const r=await api('/api/admin/credits',{userId:id,delta:amount});
    toast(`Solde du joueur : ${r.after.toLocaleString('fr-FR')} crédits.`);
    await renderAdmin();
  }catch(e){toast(e.message,true);}
}
async function createOnlinePlayer(){const form=document.getElementById('form-player');if(!form)return;const username=form.elements.username.value,password=form.elements.password.value;try{await api('/api/admin/users',{username,password});form.reset();toast('Joueur créé : envoie-lui ses identifiants en privé.');renderAdmin();}catch(e){toast(e.message,true);}}
async function resetOnlinePlayer(id){const password=prompt('Nouveau mot de passe PROVISOIRE (12 caractères minimum) :');if(!password)return;try{await api('/api/admin/password-reset',{userId:id,password});toast('Mot de passe provisoire modifié. Transmets-le en privé.');renderAdmin();}catch(e){toast(e.message,true);}}
async function toggleOnlinePlayer(id,disabled){try{await api('/api/admin/disable',{userId:id,disabled});renderAdmin();toast(disabled?'Compte bloqué.':'Compte réactivé.');}catch(e){toast(e.message,true);}}
document.addEventListener('input',e=>{if(e.target?.id==='bet-custom-stake')betStakeDraft=e.target.value;});
document.addEventListener('submit',async e=>{
  if(e.target.id==='form-player'){e.preventDefault();createOnlinePlayer();return;}
  if(e.target.id!=='form-auth')return;e.preventDefault();const form=e.target,mode=form.dataset.mode,d=Object.fromEntries(new FormData(form).entries());
  try{
    if(mode==='setup'){await api('/api/auth/setup',d);await loadOnlineGame();}
    else if(mode==='login'){const {error}=await mashupAuth.auth.signInWithPassword({email:d.username,password:d.password});if(error)throw new Error('Identifiants incorrects.');const r=await api('/api/auth/me');onlineUser=r.user;if(!onlineUser){await mashupAuth.auth.signOut();throw new Error('Compte non autorisé.');}if(onlineUser.mustChange)showAuth('password');else await loadOnlineGame();}
    else {await api('/api/auth/password',d);const {error}=await mashupAuth.auth.signInWithPassword({email:onlineUser.username,password:d.newPassword});if(error)throw new Error('Reconnecte-toi avec ton nouveau mot de passe.');await loadOnlineGame();}
  }catch(error){const el=document.getElementById('auth-error');if(el)el.textContent=error.message;}
});
document.getElementById('account-button').addEventListener('click',()=>setView('profile'));
setInterval(async()=>{if(!document.hidden&&view==='arena'&&arenaSection==='online'&&onlineUser&&!onlineBusy){await renderOnline(true);}},6000);
setInterval(()=>{if(view==='arena'&&arenaSection==='online'&&onlineUser)updatePvpClock();},1000);
setInterval(()=>{if(!document.hidden&&onlineUser)pollInvitations();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&onlineUser){pollInvitations();if(view==='arena'&&arenaSection==='online')renderOnline(true);}});

bootOnline();
