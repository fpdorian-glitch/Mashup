name: Frontend regression tests

on:
  pull_request:
  push:
    branches: [feature/mashup-v15-immersion, feature/mashup-v15-1-arena-reborn, feature/mashup-auto-series-catalog, feature/mashup-v15-4-grand-update, feature/mashup-v15-6-immersion-match-2, fix/restore-v15-7-2-mobile, feature/mashup-v16-1-social]

permissions:
  contents: read

jobs:
  reference-and-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax, protected contracts and presentation behavior
        run: node --test --test-isolation=none tests/phase-0/reference.test.mjs tests/mobile/presentation.test.mjs tests/v14/*.test.mjs tests/v15/*.test.mjs tests/v15-1/*.test.mjs tests/catalogue/*.test.mjs tests/v15-3/*.test.mjs tests/v15-4/*.test.mjs tests/v15-5/*.test.mjs tests/v15-6/*.test.mjs tests/v15-7/*.test.mjs tests/v16-1/*.test.mjs

  browser-social-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser tooling (no application dependency changes)
        run: |
          npm install --prefix /tmp/mashup-ui-validation playwright-core@1.64.1
          /tmp/mashup-ui-validation/node_modules/.bin/playwright-core install --with-deps chromium
      - name: Test the real frontend with fictional API responses
        env:
          NODE_PATH: /tmp/mashup-ui-validation/node_modules
        run: |
          export CHROMIUM_PATH="$(NODE_PATH=/tmp/mashup-ui-validation/node_modules node -p 'require("playwright-core").chromium.executablePath()')"
          node tests/v16-1/browser.cjs
